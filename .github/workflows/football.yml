name: Football dashboard

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # every 15 minutes
    - cron: "55 20 * * *"          # 23:55 Amman = daily summary
  workflow_dispatch:
    inputs:
      daily:
        description: "Send the daily summary too"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: football
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install requests

      - name: Update dashboard
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DAILY: ${{ github.event.schedule == '55 20 * * *' || inputs.daily == true || inputs.daily == 'true' }}
        run: |
          if [ "$DAILY" = "true" ]; then
            python step8_dashboard.py --daily
          else
            python step8_dashboard.py
          fi

      - name: Save results
        run: |
          git config user.name "football-bot"
          git config user.email "football-bot@users.noreply.github.com"
          git add -A data dashboard.html agent_settings.json
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -q -m "Update $(date -u +%Y-%m-%dT%H:%M)"
            git pull -q --rebase
            git push -q
          fi
